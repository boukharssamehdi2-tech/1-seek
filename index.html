<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>1-Seek — Snake Hunt</title>
<link rel="stylesheet" href="style.css"></head><body><main class="wrap"><header class="hud"><div class="panel">🏆 SCORE<br><b id="score">0</b></div><div class="panel"><div class="brand">1-SEEK</div><div class="subtitle">SNAKE HUNT</div></div><div class="panel" style="text-align:right">🐍 LONGUEUR<br><b id="len">18</b></div></header><div class="meta"><span>🐭 Souris : <b id="alive">8</b></span><span>⏱ <b id="timer">00:00</b></span></div><canvas id="arena" width="850" height="490"></canvas><section class="controls">
<label class="control">SOURIS SIMULTANÉES <span id="countV">8</span><input id="count" type="range" min="2" max="30" value="8"></label>
<label class="control">VITESSE SERPENT <span id="speedV">4</span><input id="speed" type="range" min="1" max="10" step=".5" value="4"></label>
<label class="control">VITESSE SOURIS <span id="mouseSpeedV">2.4</span><input id="mouseSpeed" type="range" min=".5" max="7" step=".5" value="2.4"></label>
<label class="control">AGILITÉ <span id="turnV">5</span><input id="turn" type="range" min="1" max="12" step=".5" value="5"></label>
<label class="control">LONGUEUR INITIALE <span id="startV">18</span><input id="start" type="range" min="5" max="55" value="18"></label>
<label class="control">RAYON DE FUITE <span id="detectV">150</span><input id="detect" type="range" min="40" max="300" step="10" value="150"></label>
</section><div class="buttons"><button id="pause">⏸ PAUSE</button><button id="reset">↻ RECOMMENCER</button><button id="wave">🐭 NOUVELLE VAGUE</button></div><p class="hint">Déplace la souris dans l'arène pour guider le serpent. Attrape les souris pour grandir !</p></main>
<script src="src/behaviors/course-vector.js"></script>
<script src="course-reference/vehicle.js"></script>
<script src="src/behaviors/steering.js"></script>
<script src="src/game.js"></script></body></html>
